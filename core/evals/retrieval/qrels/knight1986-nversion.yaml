# 질문지 조각 — Knight & Leveson 1986 승급(2026-08-21, 검증자 독립성 갈래의 첫 반입).
# 이 소스가 만드는 검색 위험은 "독립"의 과부하다 — 이 코퍼스에서 독립은 이미 여럿을
# 가리킨다(JVM의 언어 독립성, 데이터 독립, 분산 시스템의 장애 독립, 그리고 여기의
# 통계적 독립). exact 문항은 이 페이지가 소유한 복합명사가 그 과부하를 뚫는지 보고,
# alias 문항은 원어 병기(N-version programming·coincident failures·design diversity)가
# 갈라 주는 키로 사는지를 겨냥한다. semantic 문항은 "독립"이라는 낱말을 한 번도 쓰지
# 않은 질의가 이 페이지에 닿는지를 잰다. cross-domain 셋은 이번 런이 실제로 건 세
# 링크(속성 기반 테스트·테스트 오라클·하드웨어와 소프트웨어와 사람의 결함)가 검색에서도
# 이웃으로 잡히는지를 본다.
# reply(knight1990-reply)는 별도 조각을 만들지 않는다 — 두 문서가 한 페이지를 먹이므로
# 정답 파일이 같고, 조각을 둘로 나누면 같은 페이지를 두 번 재는 것이 된다.
source: knight1986-nversion
