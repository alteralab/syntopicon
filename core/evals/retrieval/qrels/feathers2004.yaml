    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-sem-1
    query: "명세도 테스트도 없는 코드를 고쳐야 할 때 기대값을 어디서 가져오나"
    type: semantic
    description: "패러프레이즈 — 이 페이지가 답하는 하나의 질문. 오라클 어휘 불사용"
    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-sem-2
    query: "일부러 틀린 값을 넣고 실패 메시지가 알려 주는 값으로 바꾸는 절차"
