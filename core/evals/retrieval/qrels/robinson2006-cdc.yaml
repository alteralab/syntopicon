    expected_files: ["concepts/consumer-driven-contracts.md"]
    expected_in_top_k: 5
  - id: cdc-sem-3
    query: "기대를 부르는 쪽이 적고 만드는 쪽이 그것에 맞춘다"
    type: semantic
    description: "패러프레이즈 — 이 패턴의 방향 뒤집기 그대로. 고유명사 불사용"
    expected_files: ["concepts/consumer-driven-contracts.md"]
    expected_in_top_k: 5
  - id: cdc-top-1
    query: "실무자가 쓴 패턴 글을 학술 근거로 쓰면 안 되는 이유"
