# 질문지 조각 — Kim et al. 2025 승급(2026-08-21, 검증자 독립성 갈래의 두 번째 반입).
# 이 소스가 만드는 검색 위험은 갈래 안 형제 간섭이다 — 같은 갈래의
# correlated-failure-of-independent-versions가 "상관 실패"와 "독립 가정 기각"을 이미
# 소유하고 있어, 상관·독립 어휘로 던진 질의가 1986년 페이지로 빨려 갈 수 있다.
# exact 문항은 이 페이지만 가진 어휘(모델 사이의 오류 상관·둘 다 틀렸을 때의 일치율·
# 정확도 부풀림)를 겨냥하고, alias 문항은 이 페이지에서만 병기된 원어(correlated errors·
# agreement rate·algorithmic monoculture·base architecture)가 갈라 주는 키로 사는지를 잰다.
# semantic 문항은 상관·독립이라는 낱말을 한 번도 쓰지 않은 질의가 닿는지를 본다.
# cross-domain 셋은 이번 런이 실제로 건 세 링크(고전 원전·AI 판정자의 한계·판정자 모델
# 고르기)가 검색에서도 이웃으로 잡히는지를 본다.
source: kim2025-error-correlation
added: 2026-08-21
queries:
  - id: cerr-exact-1
    query: "모델 사이의 오류 상관"
    type: exact
    description: "페이지 제목 그대로 — 같은 갈래의 1986년 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-exact-2
    query: "둘 다 틀렸을 때의 일치율"
    type: exact
    description: "이 논문이 쓰는 지표의 이름 — 이 KB에서 이 페이지에만 있는 복합명사"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-exact-3
    query: "정확도 부풀림"
    type: exact
    description: "판정자 사례 연구의 핵심 낱말 — 판정자 페이지들이 아니라 기제를 잰 이 페이지가 나와야 한다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-exact-4
    query: "우연 기준 일치율"
    type: exact
    description: "수치를 읽는 데 필요한 기준선 — 분모와 단위가 붙은 자리가 잡히는지"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-alias-1
    query: "correlated errors"
    type: alias
    description: "원어 병기 — 1986년 페이지의 coincident failures와 갈라 주는 키"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-alias-2
    query: "agreement rate"
    type: alias
    description: "원어 병기 — 확립 역어가 흔들려도 남는 지표 이름"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-alias-3
    query: "algorithmic monoculture"
    type: alias
    description: "원어 병기 — 이 페이지가 범위 밖으로 밀어낸 갈래의 이름이라 여기서만 걸린다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-alias-4
    query: "base architecture"
    type: alias
    description: "원어 병기 — 상관을 설명하는 특성 중 하나. 회귀표가 있는 절이 답이다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-sem-1
    query: "회사가 다른 모델을 여럿 쓰면 서로 다른 곳에서 틀리는가"
    type: semantic
    description: "패러프레이즈 — 상관·독립 어휘 불사용. 벤더가 달라도 남는 기준선이 답"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-sem-2
    query: "더 똑똑한 모델들끼리는 실수가 더 달라지는가 더 비슷해지는가"
    type: semantic
    description: "패러프레이즈 — 이 논문의 고유 결과. 직관과 반대 방향이 답이다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-top-1
    query: "모델 여럿의 합의를 신뢰의 근거로 써도 되는가"
    type: topical
    description: "이 페이지가 서는 물음 — 판정 주체를 나누는 구조의 전제"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-top-2
    query: "리더보드 자료로 모델끼리 얼마나 닮았는지 잴 수 있는가"
    type: topical
    description: "측정 설계 절 — 자료 셋과 지표가 답이다"
    expected_files: ["concepts/correlated-errors-across-llms.md"]
    expected_in_top_k: 5
  - id: cerr-x-1
    query: "따로 만든 것들이 따로 틀린다는 가정이 실제로 성립하나"
    type: cross-domain
    description: "같은 물음의 두 층 — 1986년 프로그램 판본과 2025년 언어 모델이 짝으로 걸려야 한다"
    expected_files: ["concepts/correlated-errors-across-llms.md", "concepts/correlated-failure-of-independent-versions.md"]
    expected_in_top_k: 5
  - id: cerr-x-2
    query: "판정하는 모델이 자기와 같은 계열을 후하게 매기는 문제"
    type: cross-domain
    description: "같은 편향의 두 자리 — 한계 목록(ai-judge-limitations)과 그 기제의 실측"
    expected_files: ["concepts/correlated-errors-across-llms.md", "concepts/ai-judge-limitations.md"]
    expected_in_top_k: 5
  - id: cerr-x-3
    query: "판정자를 더 강한 모델로 바꾸면 평가가 더 믿을 만해지는가"
    type: cross-domain
    description: "선택 기준과 그 조건 — 판정자 고르기 페이지와 이 실측이 짝으로 걸려야 한다"
    expected_files: ["concepts/correlated-errors-across-llms.md", "concepts/ai-judge-selection.md"]
    expected_in_top_k: 5
