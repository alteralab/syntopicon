# 질문지 조각 — Baltes 외 2026 승급(2026-08-22, 수용·벤치마크 갈래의 첫 반입).
# 이 소스가 만드는 검색 위험은 두 갈래다. 하나는 어휘 간섭이다 — "유통기한"과
# "버전 조건"은 llm-generated-test-defect-distribution이 이미 소유하고 있고,
# "벤치마크"와 "데이터 오염"은 huyen2025 계열 페이지들(public-benchmarks-and-leaderboards·
# data-contamination·evaluation-pipeline-design)이 소유한다. 둘째는 층 혼동이다 —
# 이 페이지는 "무엇을 밝혀야 하는가"(연구 보고 규범)에 답하고 옆 페이지들은 "무엇을
# 어떻게 재는가"(평가 시스템)에 답하는데, 낱말이 겹친다.
# exact 문항은 이 페이지만 가진 어휘(보고 규범·요구와 권고·연구 실행 날짜·종단 재실행)를
# 겨냥한다. alias 문항은 이 페이지에서만 병기된 원어(must·should·longitudinal re-runs·
# construct validity)가 갈라 주는 키로 사는지를 잰다. semantic 문항은 규범·지침이라는
# 낱말을 한 번도 쓰지 않은 질의가 닿는지를 본다. cross-domain 셋은 이번 런이 실제로 건
# 링크(두 실측 페이지와 데이터 오염)가 검색에서도 이웃으로 잡히는지를 본다.
source: baltes2026-llm-guidelines
added: 2026-08-22
queries:
  - id: lenorm-exact-1
    query: "LLM 실증 연구의 보고 규범"
    type: exact
    description: "페이지 제목 그대로 — 평가 시스템 계열 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/llm-empirical-study-reporting-norms.md"]
    expected_in_top_k: 5
  - id: lenorm-exact-2
    query: "요구와 권고를 가르는 기준"
    type: exact
    description: "이 문서의 두 층 구획 — 이 KB에서 이 페이지에만 있는 절 이름"
    expected_files: ["concepts/llm-empirical-study-reporting-norms.md"]
    expected_in_top_k: 5
  - id: lenorm-exact-3
    query: "연구 실행 날짜"
    type: exact
