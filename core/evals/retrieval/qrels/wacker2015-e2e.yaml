# 질문지 조각 — Wacker 2015, "Just Say No to More End-to-End Tests"(Google Testing Blog)
# 승급. 2026-08-23, 스위트 운영 갈래의 둘째 반입. 각주 소스인 Slack Engineering의
# 에이전트 테스팅 보고(gorbachov2026-agentic-testing)도 같은 페이지에 들어오므로 이
# 조각이 둘을 함께 잰다.
#
# 이 반입이 만드는 검색 위험은 셋이다.
#
# 하나는 **같은 회사 두 수치가 서로를 밀어내는 것**이다. 새 페이지는 70/20/10을,
# 기존 concepts/google-test-sizes-and-suite-operations.md는 80/15/5를 소유한다. 배합을
# 물었을 때 엉뚱한 쪽이 오면 다음 세션이 수치를 섞는다. 그래서 두 수치 각각에 exact
# 문항을 걸었다. 승급 시점에 `70/20/10`은 KB에서 이 소스 계열 밖에서 0건이었다.
#
# 둘은 **"종단"이라는 낱말의 과부하**다. 이 KB의 concepts/end-to-end-argument.md는
# 시스템 설계의 종단 간 논증(Saltzer)이고 테스트와 무관하다. 종단 테스트를 물었는데
# 그쪽이 오면 실패다.
#
# 셋은 **논거가 수치에 묻히는 것**이다. 이 페이지의 중심은 70/20/10이 아니라 실패
# 위치를 지목하는 피드백 루프라는 논거인데, 널리 인용되는 것은 수치 쪽이다. 논거를
# 낱말 없이 물었을 때 이 페이지가 잡히는지를 sem·top 문항이 잰다.
#
# cross-domain 셋이 이 조각의 계측 목적이다. wacker-x-1은 같은 회사 두 문헌이 한 질의에
# 함께 오는지를(이번 런이 실제로 건 양방향 링크다), wacker-x-2는 불안정 판정이 관문의
# 조건으로 배선된 쪽과 짝이 되는지를, wacker-x-3은 에이전트가 판정자가 되는 축과
# 닿는지를 잰다.
source: wacker2015-e2e
added: 2026-08-23
queries:
  - id: wacker-exact-1
    query: "종단 테스트를 왜 줄이는가"
    type: exact
    description: "페이지 제목 그대로. 시스템 설계의 종단 간 논증 페이지가 아니라 이쪽이 1위여야 한다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-exact-2
    query: "70/20/10 단위 통합 종단 배합"
    type: exact
    description: "이 글의 배합. 같은 회사 2020년 책의 80/15/5와 갈려야 한다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-exact-3
    query: "80/15/5 테스트 비중 목표치"
    type: exact
    description: "반대 방향의 대조 문항. 이쪽은 2020년 책 페이지가 1위여야 한다"
    expected_files: ["concepts/google-test-sizes-and-suite-operations.md"]
    expected_in_top_k: 5
  - id: wacker-exact-4
    query: "실패한 테스트는 사용자에게 이롭지 않다"
    type: exact
    description: "이 글의 출발점. 값어치가 버그 수정에만 붙는다는 논법의 첫 문장이다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-alias-1
    query: "Mike Wacker Just Say No to More End-to-End Tests"
    type: alias
    description: "저자와 원문 제목. 승급 시점에 이 표기는 KB에서 이 계열에만 있었다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-alias-2
    query: "good first guess suggests 제안 어조"
    type: alias
    description: "수치의 지위를 정하는 원문 낱말. 이 값이 측정이 아니라는 판정의 근거다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-alias-3
    query: "Playwright MCP 에이전트 반복 실패율"
    type: alias
    description: "각주 소스의 실측. 승급 시점에 Playwright는 KB에서 이 계열에만 있었다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-sem-1
    query: "테스트가 실패했을 때 어디가 문제인지 알려주는가"
    type: semantic
    description: "실패 위치 지목 논거를 낱말 없이 물었다. 이 페이지의 중심 절이 답이다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-sem-2
    query: "느리고 자주 깨지는 큰 테스트를 줄여야 하는 이유"
    type: semantic
    description: "패러프레이즈. 피드백 루프의 성질 셋이 답이다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-top-1
    query: "블로그에 실린 통과율 표를 실측으로 인용해도 되는가"
    type: topical
    description: "지어낸 사례라고 저자가 밝힌 자리. 예시임을 적어 둔 절이 답이다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-top-2
    query: "핵심 사용자 여정만 종단 테스트로 남기라는 말의 출처"
    type: topical
    description: "이 글에 없는 낱말이라는 판정이 답이다. 널리 퍼진 정식화를 이 소스에 귀속시키지 않는다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md"]
    expected_in_top_k: 5
  - id: wacker-x-1
    query: "구글이 적은 테스트 배합 수치"
    type: cross-domain
    description: "이 조각의 계측 문항 하나. 같은 회사 두 문헌이 함께 돌아와야 수치를 섞지 않는다. 이번 런이 건 양방향 링크가 이 자리다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md", "concepts/google-test-sizes-and-suite-operations.md"]
    expected_in_top_k: 5
  - id: wacker-x-2
    query: "불안정한 테스트가 신뢰를 깎는다"
    type: cross-domain
    description: "논거를 적은 쪽과 그 판정을 관문 조건으로 배선한 쪽이 짝으로 걸려야 한다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md", "concepts/filter-chain-for-generated-tests.md"]
    expected_in_top_k: 5
  - id: wacker-x-3
    query: "에이전트가 검증을 맡을 때 무엇이 문제인가"
    type: cross-domain
    description: "종단 신호가 에이전트 루프를 오염시킨다는 이 페이지의 가설과 검증자 분리 쪽이 함께 와야 그 축이 이어진다"
    expected_files: ["concepts/why-fewer-end-to-end-tests.md", "concepts/verifier-separation-in-agent-workflows.md"]
    expected_in_top_k: 5
