# 질문지 조각 — 자동 생성 오라클의 한계 묶음 승급(2026-08-21, 검증 축 다섯 번째).
# 이 페이지가 지는 검색 위험은 갈래 안 형제 간섭이다 — test-oracle이 오라클·단정 어휘를,
# llm-generated-test-defect-distribution이 생성 테스트·결함 어휘를 이미 다 쓰고 있어,
# "생성된 기대값이 현재 동작을 베낀다"를 찾는 질의가 둘 중 하나로 빨려 갈 수 있다.
# exact 문항은 이 페이지만 가진 어휘(변경 감지 테스트·안전망 통제실험·커버리지와 결함 발견의
# 분리)를 겨냥하고, alias 문항은 이 페이지에서만 병기된 원어(change-detector test·EvoSuite·
# stickiness)가 갈라 주는 키로 사는지를 잰다. cross-domain 둘은 형제 둘과 짝으로 걸리는지를 본다.
#
# 같은 묶음의 나머지 두 citekey(vonken2012-refactoring·eagle2015-change-detector)는 조각을
# 만들지 않는다 — 정답 페이지가 이 한 장으로 같아 문항만 중복되고 분모가 부풀어 레그 비교가
# 흐려진다. 대신 두 소스가 각각 소유한 절을 이 조각의 문항으로 덮었다(refac-1·change-1·2).
source: fraser2015-user-study
added: 2026-08-21
queries:
  - id: curbeh-exact-1
    query: "현재 동작을 오라클로 쓴다는 것"
    type: exact
    description: "페이지 제목 그대로 — 형제 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-exact-2
    query: "변경 감지 테스트"
    type: exact
    description: "구글 글이 소유한 절의 이름 — 이 KB에서 이 페이지에만 있는 복합명사"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-exact-3
    query: "커버리지는 오르고 결함 발견은 오르지 않았다"
    type: exact
    description: "이 묶음의 핵심 실측 — 절 제목이 그대로 질의가 되는 자리"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-refac-1
    query: "리팩터링 안전망 명제의 통제실험"
    type: exact
    description: "Vonken 절 — feathers2004가 반증 근거로 걸 앵커가 검색으로도 잡히는지"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-alias-1
    query: "change-detector test"
    type: alias
    description: "원어 병기 — 확립 역어가 없어 원어가 유일한 정확 일치 키다"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-alias-2
    query: "EvoSuite"
    type: alias
    description: "도구 이름 — 이 페이지의 수치를 묶는 조건이자 실험의 대상 도구"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-alias-3
    query: "stickiness"
    type: alias
    description: "원어 병기 — 도구가 준 시작점에 사람이 머무는 성질에 논문이 붙인 이름"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-sem-1
    query: "코드를 보고 쓴 기대값은 그 코드가 이미 틀려 있을 때 무엇이 되는가"
    type: semantic
    description: "패러프레이즈 — 오라클·단언 어휘 불사용. 생성 단언이 관측을 적는다는 기제가 답"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-sem-2
    query: "테스트가 지나가는 줄을 늘리면 버그를 더 찾게 되나"
    type: semantic
    description: "패러프레이즈 — 커버리지와 결함 발견이 갈린 통제실험 결과가 답"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-top-1
    query: "테스트가 있으면 리팩터링이 더 빠르고 결과가 더 좋은가"
    type: topical
    description: "Vonken 통제실험의 두 연구 질문 — 시간과 품질 둘 다 이득이 안 나온 자리"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-top-2
    query: "자동 생성 테스트가 해롭다고 말할 수 있는 근거가 있는가"
    type: topical
    description: "지지 범위 한정 절 — 넘겨 인용되는 것을 막는 자리가 검색으로 잡혀야 한다"
    expected_files: ["concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-x-1
    query: "이전 판본을 오라클로 쓰는 회귀와 지금 판본을 오라클로 쓰는 퇴화"
    type: cross-domain
    description: "같은 축의 이론과 실측 — 서베이 분류(test-oracle)와 그 퇴화형의 실증"
    expected_files: ["concepts/current-behaviour-as-oracle.md", "concepts/test-oracle.md"]
    expected_in_top_k: 5
  - id: curbeh-x-2
    query: "생성된 테스트의 단언이 스스로 틀리는 문제의 이전 세대와 지금 세대"
    type: cross-domain
    description: "같은 기제의 두 시대 — 2015년 도구 실측과 LLM 생성물 실측이 짝으로 걸려야 한다"
    expected_files: ["concepts/current-behaviour-as-oracle.md", "concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
