# 질문지 조각 — Luo, Hariri, Eloussi & Marinov 2014, "An Empirical Analysis of Flaky
# Tests"(FSE'14). 승급. 2026-08-23, 스위트 운영 갈래의 셋째이자 마지막 반입.
#
# **각주 소스 둘의 조각을 여기 합쳤다.** micco2016-flaky(구글 테스팅 블로그)와
# micco2017-ci(발표 슬라이드)는 정답 페이지가 같다 — 셋 다
# concepts/flaky-test-root-causes-and-fixes.md 로 답한다. 조각을 따로 두면 같은 정답을
# 세 파일이 주장하게 되므로 한 벌로 잰다.
#
# 이 반입이 만드는 검색 위험은 넷이다.
#
# 하나는 **"불안정"이라는 낱말이 이제 세 페이지에 걸린다**는 것이다. 새 페이지가 원인과
# 고침을, concepts/google-test-sizes-and-suite-operations.md 가 운영 수치와 조직 조문을,
# concepts/why-fewer-end-to-end-tests.md 가 피드백 루프의 성질 하나를 소유한다. 어느
# 질문에 어느 쪽이 와야 하는지를 exact 넷과 x-1 이 가른다. 승급 시점에 이 갈래는
# 셋으로 닫히므로 여기가 갈래 안 분업의 계측 지점이다.
#
# 둘은 **분모가 섞이는 것**이다. 이 반입은 서로 다른 분모의 백분율을 일곱 개 들여왔다.
# 논문 쪽은 161/74/32/19 이고 각주 쪽은 테스트 실행/테스트 개수/전이 셋이다. 분모를
# 물었을 때 엉뚱한 소스가 오면 다음 세션이 수치를 섞는다. exact-3 과 x-2 가 이 자리다.
#
# 셋은 **"순서 의존"이라는 낱말의 과부하**다. 승급 시점에 그 말은 KB의 여덟 페이지에
# 있고 그중 일곱은 테스트와 무관하다(작업 단위·정확히 한 번 처리·시간 결합·전체 순서의
# 한계·데이터 볼트 셋). 테스트 격리를 물었는데 그쪽이 오면 실패다. sem-2 가 이것을 잰다.
#
# 넷은 **원어 범주 이름이 검색 키로 서는가**다. Async Wait·Test Order Dependency·
# waitFor·Marinov·intermit 은 승급 시점에 KB에서 이 계열 밖 0건이었다. 역어를 쓰지 않고
# 원어를 유지한 판단이 검색에서 값을 내는지를 alias 셋이 잰다.
#
# cross-domain 셋이 이 조각의 계측 목적이다. x-1 은 갈래 세 페이지가 한 질의에 함께
# 오는지를, x-2 는 관문 조건으로 배선된 쪽과 원인 쪽이 짝이 되는지를, x-3 은 판정자가
# 에이전트가 되는 축과 닿는지를 잰다.
source: luo2014-flaky
added: 2026-08-23
queries:
  - id: luo-exact-1
    query: "불안정 테스트의 원인 분류와 고침"
    type: exact
    description: "페이지 제목 그대로. 같은 갈래의 운영 수치 페이지가 아니라 이쪽이 1위여야 한다"
    expected_files: ["concepts/flaky-test-root-causes-and-fixes.md"]
    expected_in_top_k: 5
  - id: luo-exact-2
    query: "Async Wait Concurrency Test Order Dependency 상위 세 범주"
    type: exact
