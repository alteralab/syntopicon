# 질문지 조각 — Inozemtseva & Holmes 2014("Coverage Is Not Strongly Correlated with Test
# Suite Effectiveness") 승급. 2026-08-23, 스위트 평가 갈래의 둘째 반입.
#
# 이 소스가 만드는 검색 위험은 두 겹이다. 첫째는 어휘 간섭이다 — "커버리지"를 이 KB에서
# 여섯 페이지가 나눠 갖고(marick1999-coverage 조각의 머리말 참조), 이번 런이 거기에 둘을
# 더했다. 둘째는 이번 런에만 있는 위험인데, 같은 갈래에 **거의 같은 낱말로 반대 답을 내는
# 형제 페이지**(coverage-predicts-mutation-kills)가 동시에 들어왔다는 것이다. 두 페이지가
# 서로를 밀어내면 exact 문항이 엉뚱한 극을 1위로 올린다.
#
# exact 문항은 이 페이지만 가진 낱말(정규화 효과성·동등 뮤턴트·수정 조건 커버리지·DO-178B)을
# 겨냥한다. 넷 다 승급 시점에 이 페이지 밖에서 0건이었다(MC/DC만 형제 페이지와 공유한다).
# alias 문항은 이 페이지에서 병기한 원어가 갈라 주는 키로 사는지를 잰다. semantic 문항은
# 커버리지라는 낱말 없이 물었을 때 닿는지를 본다 — 이 페이지의 논거는 교란 변수 문제라
# 낱말 없이 물어질 확률이 높다. cross-domain 셋은 이번 런이 실제로 건 보강 링크를 잰다.
#
# pair 문항(covsize-pair-1)이 이 조각의 계측 목적이다. 정답 둘을 모두 정답으로 두므로
# r_at_5가 0.5면 한 극만, 1.0이면 양 극이 함께 돌아온 것이다. 이 쌍은 미해소라 한 극만
# 돌아오는 상태가 곧 KB가 논쟁을 정설로 보이게 하는 실패다.
source: inozemtseva2014-coverage
added: 2026-08-23
queries:
  - id: covsize-exact-1
    query: "커버리지 신호는 스위트 크기가 만든다"
    type: exact
    description: "페이지 제목 그대로. 커버리지를 나눠 갖는 일곱 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-exact-2
    query: "정규화 효과성"
    type: exact
    description: "덮은 뮤턴트로 나눈 효과성 척도. 승급 시점에 이 페이지 밖에서 0건"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-exact-3
    query: "동등 뮤턴트를 어떻게 처리했는가"
    type: exact
    description: "마스터 스위트가 못 죽인 뮤턴트를 동등으로 간주한 가정이 답이다. 이 페이지만 갖는 낱말"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-exact-4
    query: "수정 조건 커버리지가 더 알려 주는가"
    type: exact
    description: "강한 커버리지 기준이 추가 정보를 주지 않는다는 결과. 이 측도 이름은 이 페이지만 갖는다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-exact-5
    query: "스위트 크기를 고정하고 상관을 다시 재면"
    type: exact
    description: "이 논문의 설계 그 자체. 크기 통제 뒤 상관이 내려앉는 절이 답이다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-alias-1
    query: "modified condition coverage"
    type: alias
    description: "원어 병기. 줄 커버리지와 분기 커버리지를 쓰는 페이지들과 갈라 준다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-alias-2
    query: "DO-178B"
    type: alias
    description: "항공 표준 이름. 이 페이지만 갖는 키이고 표준 제정 기관 쪽 함의가 답이다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-sem-1
    query: "두 변수가 상관해 보이는 이유가 세 번째 변수 때문일 때"
    type: semantic
    description: "패러프레이즈. 커버리지도 효과성도 크기라는 낱말도 쓰지 않고 교란 변수만 묻는다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-sem-2
    query: "테스트를 많이 쓰면 잘 잡는 것이지 잘 덮어서 잡는 것이 아니다"
    type: semantic
    description: "패러프레이즈. 크기가 상관을 만든다는 이 페이지의 주장이 답이다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-sem-3
    query: "스위트가 좋아질수록 커버리지가 알려 주는 것이 줄어든다"
    type: semantic
    description: "가장 크고 충실한 스위트에서 상관이 사라졌다는 5절 관찰이 답이다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-top-1
    query: "고정 커버리지 값을 품질 목표로 걸어도 되는가"
    type: topical
    description: "이 논문이 부정하는 것 그 자체. 실무자 층과 실증 층이 함께 잡혀도 이 페이지가 top5 안에 있어야 한다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-top-2
    query: "커버리지 말고 무엇으로 스위트 품질을 재는가"
    type: topical
    description: "저자들이 뮤테이션 점수를 잠정 대체물로 내놓는 자리. 이 페이지의 효과성 정의와 나란히 읽히는 물음이다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md"]
    expected_in_top_k: 5
  - id: covsize-x-1
    query: "커버리지를 목표로 삼지 말라는 주장을 실증으로 확인했는가"
    type: cross-domain
    description: "실무자 원전 쪽과 그것을 참고문헌으로 든 실증 쪽이 짝으로 걸려야 한다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md", "concepts/coverage-as-clue-not-target.md"]
    expected_in_top_k: 5
  - id: covsize-x-2
    query: "실제 버그로 재면 커버리지 상관이 달라지는가"
    type: cross-domain
    description: "종속변수를 바꾸는 프레임. 회의 측 페이지와 커버리지가 올라도 결함 발견은 안 오른 통제실험이 함께 잡혀야 한다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md", "concepts/current-behaviour-as-oracle.md"]
    expected_in_top_k: 5
  - id: covsize-pair-1
    query: "커버리지가 스위트 효과성을 예측하는가"
    type: cross-domain
    description: "이 쌍의 계측 문항. 논쟁의 두 극이 한 질의에 함께 돌아와야 한다. 한 극만 오면 r_at_5가 0.5로 떨어진다"
    expected_files: ["concepts/coverage-confounded-by-suite-size.md", "concepts/coverage-predicts-mutation-kills.md"]
    expected_in_top_k: 5
