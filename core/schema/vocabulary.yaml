# 본문 인라인 폐쇄 어휘. JSON Schema가 아니다 — frontmatter가 아니라 md 본문을
# 대상으로 하므로 소비자는 kb-lint의 AST 스캔이다(PLAN §2.1·§4.3).
#
# 추가는 이 파일 개정 + schema/migrations.md 기록으로만. 임의 토큰은 lint가 검출한다.

epistemic:
  # 무표기 = 사실 서술. 숫자 confidence는 금지한다(PLAN §2.1).
  # lint는 본문의 인라인 `#<토큰>` 중 아래에 없는 것을 전부 리포트한다 —
  # 이것이 "태그 없음"(PLAN §6 불채택)의 집행 기전이기도 하다.
  tokens:
    hypothesis:
      description: 근거가 있으나 확정되지 않은 주장. 반증 가능한 형태로 적는다.
    speculation:
      description: 근거가 얇은 추측. 출처가 뒷받침하지 않는 자기 판단임을 표시한다.

time-relative:
  # 읽는 시점마다 뜻이 바뀌는 낱말 — 소스의 issued 연도로 못 박는다("2022년 저술 시점").
  # 10–20년 KB에서 이 낱말은 곧 거짓이 된다(사용자 교정 2026-09-19, dataops 페이지의
  # "현시점에서 DataOps는 진행 중"). 인용 블록 안(저자의 말 그대로)은 검사하지 않는다.
  # 현재(1,070건 중 시점 뜻 약 12%)·최신·아직은 명사 용법이 대부분이라 기계 검출에서 뺐다 —
  # 사람과 반입 에이전트의 판단 몫(kb-ingest 4단계 저작 규칙). 추가는 이 파일 개정 +
  # migrations.md 기록으로만 — 반례마다 낱말을 덧붙이지 않는다(PLAN §3).
  words: [현시점, 오늘날, 요즘, 요즈음, 지금은, 이제는, 근래, 당대, 모던, 현대]
  # words 의 낱말이 아래 합성어의 앞부분으로 나오면 세지 않는다(기술 명사).
  except: [현대화]
