# 질문지 조각 — Yuan et al. ChatGPT 테스트 생성 전수 분석 승급(2026-08-21, 검증 축 네 번째).
# 이 소스가 만드는 검색 위험은 형제 간섭이다 — 같은 갈래의 test-oracle이 이미 오라클·단정·
# 커버리지 어휘를 다 쓰고 있어, 실측을 찾는 질의가 이론 페이지로 빨려 갈 수 있다.
# exact 문항은 이 페이지만 가진 실측 어휘(결함 분포·컴파일 오류·실행 실패)를 겨냥하고,
# alias 문항은 이 페이지에서만 병기된 원어(focal method·non-trivial assertion·모델 이름)가
# 갈라 주는 키로 사는지를 잰다. cross-domain 둘은 이론 페이지와 짝으로 걸리는지를 본다.
#
# 각주 대조원 셋(schafer2024-testpilot·wang2025-mutgen·banik2026-allsmoke)의 조각은 만들지
# 않는다 — 정답 페이지가 같아 문항이 중복되고, 분모만 부풀어 레그 비교가 흐려진다.
source: yuan2024-chatgpt-tests
added: 2026-08-21
queries:
  - id: llmtest-exact-1
    query: "LLM 생성 테스트의 결함 분포"
    type: exact
    description: "페이지 제목 그대로 — 형제 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-exact-2
    query: "컴파일 오류와 실행 실패의 분해"
    type: exact
    description: "복합명사 — 두 층으로 갈린 결함을 세는 자리"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-exact-3
    query: "비자명 단정"
    type: exact
    description: "이 페이지에만 있는 역어 — 대상 함수에 실제로 의존하는 단정"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-alias-1
    query: "focal method"
    type: alias
    description: "원어 병기 — 확립 역어가 없어 원어가 유일한 정확 일치 키다"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-alias-2
    query: "non-trivial assertion"
    type: alias
    description: "원어 병기 — 실행 성공과 실제 검사를 가르는 지표의 이름"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-alias-3
    query: "gpt-3.5-turbo"
    type: alias
    description: "모델 이름 — 이 페이지의 수치를 묶는 조건이고 버전 조건 블록의 값이다"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-sem-1
    query: "모델이 짜 준 테스트가 깨졌을 때 코드가 틀린 것인지 테스트가 틀린 것인지"
    type: semantic
    description: "패러프레이즈 — 오라클·단정 어휘 불사용. 도구가 실행 실패를 고치지 못하는 이유가 답"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-sem-2
    query: "자동으로 만든 테스트가 통과하는데 실제로 검사하는 것이 없을 때"
    type: semantic
    description: "패러프레이즈 — 실행 성공과 검사 실질성이 별개라는 대목"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-top-1
    query: "생성한 테스트의 통과율이 모델과 언어에 따라 얼마나 달라지나"
    type: topical
    description: "유통기한 절 — 같은 절차로 모델과 언어를 바꿔 잰 값들"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md"]
    expected_in_top_k: 5
  - id: llmtest-x-1
    query: "기대값을 무엇에 비추어 정하는가의 이론과 그것이 실제로 얼마나 틀리는가의 실측"
    type: cross-domain
    description: "같은 문제의 두 층 — 서베이 분류(barr2015-oracle)와 이 실측"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md", "concepts/test-oracle.md"]
    expected_in_top_k: 5
  - id: llmtest-x-2
    query: "테스트가 통과했다는 사실이 무게를 잃는 자리"
    type: cross-domain
    description: "통과의 증거력 — 상한 명제(dijkstra1969)와 통과율이 테스트 자신의 옳음일 뿐이라는 실측"
    expected_files: ["concepts/llm-generated-test-defect-distribution.md", "concepts/testing-shows-presence-not-absence.md"]
    expected_in_top_k: 5
