# 질문지 조각 — Kaner·Bach·Pettichord 2002 승급(2026-08-22, 자동화 경계 갈래의 셋째 반입).
# 이 소스가 만드는 검색 위험은 넷이다. ① "맥락 주도 테스팅"이라는 낱말이 이미 코퍼스에
# 있다 — kaner2013-insapience 소스와 testing-checking 두 페이지가 그 낱말을 인용 문면으로
# 담고 있어, 원칙을 소유한 신규 페이지가 그 선점을 뚫어야 한다. 뚫지 못하면 "맥락 주도
# 테스팅이 뭐냐"는 질의가 원칙이 아니라 원칙을 인용한 논쟁 글로 간다. ② "모범 사례가
# 없다"는 조항이 coconuts-dont-cut-it와 갈린다 — 그쪽은 방법론 채택의 화물 숭배이고
# 이쪽은 테스팅 프랙티스의 평가 축이다. 두 페이지가 서로를 밀어내지 않고 각자 자기
# 질의를 받는지 본다. ③ "버그 옹호"는 코퍼스에 없던 새 복합명사인데, 낱말을 이루는
# "버그"와 "보고"가 둘 다 과부하돼 있다 — 단독 낱말이 아니라 복합명사가 키로 사는지
# 따로 재야 한다. ④ 이 소스의 등급이 실무자 선언이라 수치가 하나도 없다 — 이 갈래에서
# 처음으로 숫자 없이 서는 페이지 둘이고, 어휘 레그가 기댈 고유 토큰이 그만큼 적다.
# 마지막 두 문항은 갈래 배선 계측이다. 원칙 페이지가 testing-checking 쌍의 근거로
# 회수되는지, 버그 옹호가 검증자 분리 문면과 함께 물려 오는지를 본다.
