  - id: schelter-sem-3
    query: "자동으로 제안된 검사 규칙을 그대로 믿어도 되나"
    type: semantic
    description: "패러프레이즈 — 표본에서만 참인 제약과 그 오제안 실측이 붙은 자리"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-top-1
    query: "품질 지표의 과거 시계열을 기준으로 이상을 잡는 방법"
    type: topical
    description: "메트릭 이력 위의 이상 탐지 — 관측 탐지 패턴·드리프트 탐지와 이웃이되 여기가 잡혀야 한다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-x-1
    query: "임의 제약을 열 것인가 제한된 스키마 언어로 좁힐 것인가"
    type: cross-domain
    description: "같은 해 두 프로덕션 시스템이 갈린 자리 — 두 페이지가 짝으로 걸려야 한다"
    expected_files: ["concepts/declarative-data-quality-constraints.md", "concepts/data-validation-for-ml-pipelines.md"]
    expected_in_top_k: 5
