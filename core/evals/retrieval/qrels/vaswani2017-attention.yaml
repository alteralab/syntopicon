    description: "원어 병기 — 레이블 스무딩. 펄플렉시티를 깎고 BLEU를 올리는 맞바꿈"
    expected_files: ["concepts/why-self-attention.md"]
    expected_in_top_k: 5
  - id: att-alias-4
