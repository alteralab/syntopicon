    type: exact
    description: "스키마로 훈련 코드를 퍼즈하는 셋째 층 — 단위 테스트 어휘가 과밀한 자리에서 갈려야 한다"
    expected_files: ["concepts/data-validation-for-ml-pipelines.md"]
