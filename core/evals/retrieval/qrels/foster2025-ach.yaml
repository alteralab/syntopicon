# 질문지 조각 — Foster 외 2025(ACH) 승급(2026-08-22, 수용·벤치마크 갈래의 다섯째 반입.
# 묶음 1페이지의 뒤쪽 절반).
# 앞 조각(alshahwan2024-testgen-llm)과 정답 페이지가 같으므로, 이 조각은 **그 페이지의
# 다른 절들**을 겨냥한다. 겹치는 문항을 두지 않는다.
# 검색 위험은 둘이다. 첫째, `뮤턴트`는 반입 전 코퍼스에 4곳뿐이지만 그중 둘이 이 갈래
# 형제(benchmark-test-inadequacy)와 오라클 계열(current-behaviour-as-oracle)이라, 뮤테이션
# 문항은 반드시 이 페이지의 결과와 묶어 던진다. 둘째, `등가`는 42곳이 쓰는 일반 낱말이라
# 단독으로 쓰지 않고 `등가 뮤턴트`로만 쓴다.
# 뮤테이션 테스팅 자체의 지위를 다루는 페이지는 아직 KB에 없다(suite-assessment 갈래).
# 그래서 이 조각은 뮤테이션 이론을 묻지 않고, **이 배포가 실제로 잰 것**만 묻는다.
