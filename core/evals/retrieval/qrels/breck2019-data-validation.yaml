# 질문지 조각 — Breck et al. 2019 "Data Validation for Machine Learning" (2nd SysML Conference)
# 승급(2026-08-24, 데이터 검증 갈래의 첫 반입).
# 이 소스가 만드는 검색 위험은 세 겹이다. 첫째, "데이터 품질·검증" 어휘의 과밀 —
# data-quality-enforcement-patterns(AWAP·Constraints Enforcer)·quality-observation-patterns·
# data-quality-management·training-data-quality가 이미 그 낱말을 쓴다. 둘째, "스큐" 어휘의
# 삼중 과적재 — relieving-hot-spots가 파티션 부하 불균형으로, bitemporal-data가 실제 시각과
# 처리 시각의 거리로, observability-detector-patterns가 실행 사이 볼륨 차로 쓴다. 이 페이지의
# 왜곡은 훈련 데이터와 서빙 데이터의 값 분포 차이라 넷째 뜻이다. 셋째, "단위 테스트"와
# "드리프트" 어휘의 과밀 — 검증 축 페이지 다수와 drift-detection이 소유한다.
# 그래서 exact 문항은 이 페이지만 가진 어휘(훈련-서빙 왜곡·단일 배치 검증·모델 단위 테스트·
# 과적합한 스키마)를 겨냥하고, alias 문항은 이 페이지에서만 병기된 원어가 갈라 주는 키로
# 사는지를 잰다. cross-domain 둘은 이번 런이 실제로 건 양방향 링크(현재 동작을 오라클로 쓰기,
# 관측 탐지 패턴의 죽음의 고리)가 검색에서도 이웃으로 잡히는지를 본다.
source: breck2019-data-validation
added: 2026-08-24
queries:
  - id: breck-exact-1
    query: "훈련-서빙 왜곡"
    type: exact
    description: "이 페이지가 세운 역어 — 부하 치우침·시간 스큐 페이지가 아니라 여기가 1위여야 한다"
    expected_files: ["concepts/data-validation-for-ml-pipelines.md"]
    expected_in_top_k: 5
  - id: breck-exact-2
    query: "단일 배치 검증 배치 간 검증"
    type: exact
    description: "논문이 가른 두 층 — 둘을 함께 다루는 페이지는 여기뿐이다"
