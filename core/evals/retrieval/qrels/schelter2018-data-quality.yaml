    description: "선언 API의 이상 탐지 제약과 기본 알고리즘 이름 — 인라인 코드가 색인되는지도 함께 본다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-sem-1
