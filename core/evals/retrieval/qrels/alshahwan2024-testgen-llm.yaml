# 질문지 조각 — Alshahwan 외 2024(TestGen-LLM) 승급(2026-08-22, 수용·벤치마크 갈래의
# 다섯째 반입. 묶음 1페이지의 앞쪽 절반).
# 이 소스가 만드는 검색 위험은 **고유 어휘가 거의 없다**는 데서 온다. 반입 전 코퍼스를
# 훑어 보니 `필터 체인`은 0건이지만, 이 페이지가 실제로 쓰는 낱말은 코퍼스가 이미 크게
# 나눠 가진 것들이다 — `커버리지` 36곳, `불안정` 27곳, `관문` 15곳, `회귀 테스트` 13곳.
# 그래서 exact 문항은 낱말 하나가 아니라 **이 페이지만 갖는 결합**으로 던진다(관문의
# 순서, 다섯 번 실행, 사람 앞의 필터). alias는 반대로 이 KB가 독점하는 원어를 쓴다 —
# `TestGen-LLM`·`flaky`·`Kotlin`은 반입 전 0건이었다.
# 2026-08-23(스위트 운영 갈래 마감, 런 2026-08-23-11) 갱신: `flaky`가 더는 이 KB에서
# 이 페이지의 것이 아니다. 스위트 운영 갈래가 서면서 그 원어를 인쇄하는 파일이 열 개로
# 늘었고(개념 다섯·소스 메타 다섯), 그중 셋은 파일 이름에도 그 낱말이 들어간다. 전제가
# 무너진 `fcgt-alias-2`는 전 레그 미회수가 됐고, 이 페이지에만 인쇄된 원문 표기로 교체했다.
# semantic 셋은 이 페이지가 서는 물음을 낱말을 갈아 던진다. cross-domain 셋은 이번 런이
# 실제로 건 링크를 겨냥한다 — x-1이 잡히지 않으면 보강한 개정판이 검색에 반영되지 않은 것이다.
source: alshahwan2024-testgen-llm
