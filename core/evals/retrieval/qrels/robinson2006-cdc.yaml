    description: "등급 표기와 저자의 자기 규정 — 지위 절과 소스 메타가 답이다"
    expected_files: ["concepts/consumer-driven-contracts.md", "sources/robinson2006-cdc.md"]
    expected_in_top_k: 5
  - id: cdc-x-1
    query: "계약이라는 낱말이 가리키는 두 가지 경계"
