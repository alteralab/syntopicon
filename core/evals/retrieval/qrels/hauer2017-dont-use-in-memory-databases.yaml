# 질문지 조각 — Hauer, "Don't use In-Memory Databases (H2, Fongo) for Tests"
# (phauer.com, 2017 게시 · 2022 갱신, 2026-08-20 확보본)
# 반입(2026-08-24, unit-design-doubles 갈래의 다섯째 런). 세 소스가 한 페이지를 세운다:
# concepts/what-in-memory-database-doubles-lose.md
#
# 이 조각이 겨냥하는 것은 셋이다.
# 첫째, **이 소스만 가진 고유 명사**다 — `H2` · `Fongo` · `TestContainers`가 그것이고,
# 코퍼스에서 이 페이지에만 있다(`Testcontainers` 표기는 kafka-streams-architecture에도 있어
# 경쟁이 실재한다 — alias 문항이 그 경쟁을 잰다).
# 둘째, **이 묶음에서 유일하게 구체적인 실패 사례**다 — 예약어가 된 열 이름 때문에 초록
# 테스트가 프로덕션에서 깨진 일화.
# 셋째, **처방 층**이다. 세 소스 가운데 무엇으로 바꾸라는 데까지 가는 것은 이 소스뿐이므로
