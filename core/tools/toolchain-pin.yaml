# 툴체인 핀 (PLAN §5). 소비자: tools/qmd-setup.py · tools/backup.py.
#
# 왜 파일로 두는가: 새 기기 복구 런북이 "무엇을 설치할지"를 알아야 하는데, 그 답이
# 사람의 기억이나 산문 안에만 있으면 복구 시점에 틀린다. 갱신은 연간 항목이다.
#
# qmd-setup은 이 파일을 통째로 다시 쓰지 않고 sha256 줄만 제자리에서 고친다 —
# YAML 라운드트립은 주석을 날리고, 이 파일에서 사라지면 곤란한 것이 정확히 주석이다.

qmd:
  version: "2.1.0"
  commit: "977563e"           # qmd --version이 함께 찍는다
  package: "@tobilu/qmd"
  # npm pack 타르볼을 보존한다 — 레지스트리에서 사라져도 설치할 수 있어야 한다.
  tarball: "qmd-2.1.0.tgz"

# GGUF 3개. hf: URI는 `resolve/main`을 치므로 리비전을 고정하지 못한다(소스 확인) —
# 그래서 받아서 벤더링하고 **로컬 경로로 참조**한다. sha256이 실질 핀이다:
# 리비전 해시보다 강하고, 파일만 있으면 자기 검증이 된다.
# ⚠ `qmd status`의 "Models" 표시는 **실제 쓰는 모델이 아니다.** qmd가 벡터에 박는 모델
# id가 `options?.model ?? DEFAULT_EMBED_MODEL`이라, 여기 핀한 모델을 쓰고 있어도 화면에는
# 기본값(embeddinggemma-300M)이 뜬다. 2026-08-12에 이 표시만 보고 "핀이 깨졌다"고 판단할
# 뻔했다. **판별은 벡터 차원으로 한다** — Qwen3-Embedding-0.6B는 1024, embeddinggemma는 768:
#   uv run --group index python -c "import sys;sys.path.insert(0,'tools');\
#   from syntopicon import overlap;v=overlap.load_vectors(('it',));print(next(iter(v.values())).shape[1])"
models:
  embed:
    # PLAN §4.1: Qwen3-Embedding-0.6B 잠정. 수용 검증 A/B(vs KURE-v1) 후 확정.
    # 차원은 모델 최대(1024) 유지 — MRL 축소 금지.
    file: Qwen3-Embedding-0.6B-Q8_0.gguf
    hf_repo: Qwen/Qwen3-Embedding-0.6B-GGUF
    hf_revision: "370f27d7550e0def9b39c1f16d3fbaa13aa67728"
    sha256: "06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439"
  rerank:
    # qmd 기본값. 캐시에 있던 것을 그대로 벤더링했으므로 리비전은 미상이고,
    # sha256이 그 자리를 대신한다 — 내용이 같으면 같은 모델이다.
    file: qwen3-reranker-0.6b-q8_0.gguf
    hf_repo: ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF
    hf_revision: null
    sha256: "22c9979ce4fbcdc5acdc310c6641c32797eff1aa980b8f7a2db8a8ea23429a48"
  generate:
    file: qmd-query-expansion-1.7B-q4_k_m.gguf
    hf_repo: tobil/qmd-query-expansion-1.7B-gguf
    hf_revision: null
    sha256: "000dfb1c06efa6a049e9f64ba921c3740e2454f62abab6fa10e77bd30bb2bcc0"

# 벤더링 위치. 캐시가 아니라 **보존 대상**이다 — ~/.cache/qmd/models/ 는 cleanup이
# 지울 수 있는 자리이고, 지워지면 hf:의 움직이는 main에서 다시 받게 된다.
# restic 백업 대상(PLAN §5 표, tools/backup.py restic).
# 복구 시점의 기기에는 restic이 없을 수 있다. 백업 대상 옆에 정적 바이너리를
# 함께 두어야 "복원하려면 먼저 restic을 설치하라"는 순환에 빠지지 않는다(PLAN §5).
restic:
  version: "0.19.1"
  # 공식 릴리스는 정적 Go 바이너리다. brew 사본이 아니라 이것을 동봉한다 —
  # 어떤 판본인지 sha256으로 확정할 수 있어야 한다.
  asset: restic_0.19.1_darwin_arm64.bz2
  sha256: "06582569ff2f10e1935a6f12187c76db02f0bae99e6e54098f2cdc374766d768"

vendor_dir: ~/.local/share/syntopicon/models
