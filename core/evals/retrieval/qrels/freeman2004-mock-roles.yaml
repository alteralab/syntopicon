# 질문지 조각 — Freeman·Pryce·Mackinnon·Walnes, "Mock Roles, not Objects"(OOPSLA 2004)
# 반입(2026-08-24, unit-design-doubles 갈래의 셋째 런). 신규 페이지 하나:
#   concepts/mock-objects-for-role-discovery.md
#
# 이 소스가 만드는 검색 위험은 세 겹이다.
# 첫째, **대역 어휘의 과밀이 이 갈래에서 최고조다** — fakes-versus-mocks ·
# test-double-preference-at-scale · test-double-vocabulary-and-tdd-styles ·
# what-to-replace-with-mocks가 이미 "목·스텁·가짜·대역"을 그대로 쓰고, 이 런이 같은 낱말로
# 두 페이지를 더 넣는다. 그래서 exact 문항은 **이 논문만 가진 어휘**(역할 발견, need-driven
# development, 소유한 타입만, 오해라고 부른 것)를 겨냥한다.
# 둘째, **모순 상대와 정면으로 겹친다** — what-to-replace-with-mocks가 같은 주제를 반대
# 판정으로 쓴다. exact·topical 문항 몇을 그 갈림에 걸어 어느 쪽이 어느 질문을 가져가는지
# 본다. 한쪽이 다른 쪽 질문을 다 가져가면 그것은 페이지 경계 문제이지 질문 오류가 아니다.
# 셋째, **원어가 이 페이지에만 있는 키가 둘이다**(need-driven development ·
# Only Mock Types You Own). 원어를 역어로 옮기지 않기로 한 결정의 검색 대가를 alias 문항이
# 직접 잰다.
#
# cross-domain 둘은 이 런이 실제로 건 링크를 겨냥한다 — 모순 엣지 하나와 표어 귀속 하나.
