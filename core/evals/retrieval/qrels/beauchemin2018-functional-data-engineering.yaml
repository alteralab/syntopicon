# 질문지 조각 — Beauchemin 2018 "Functional Data Engineering — a modern paradigm for
# batch data processing"(Medium). 데이터 검증 갈래의 셋째 반입.
#
# 이 소스가 만드는 검색 위험은 세 겹이다. 첫째, **멱등 어휘의 과밀** —
# idempotent-write-patterns(다섯 패턴)·exactly-once-message-processing·
# kafka-idempotent-producer·stream-processing-fault-tolerance가 이미 그 낱말을 쓴다. 그중
# idempotent-write-patterns는 같은 개념의 '어떻게'를 담아 가장 가깝고, 이 페이지는 '왜'를
# 담는다 — 두 페이지가 서로를 밀어내지 않고 각자의 질문에서 1위여야 한다. 둘째,
# **파티션 어휘의 과적재** — topics-and-partitions·kafka-producer-partitioning은 카프카의
# 파티션이고, sharding-basics는 샤딩의 동의어로 쓴다. 이 페이지의 파티션은 배치 출력의
# 원자 단위라 셋째 뜻이다. 셋째, **불변 어휘** — state-streams-and-immutability와
# object-stores가 이미 소유한다.
#
# exact 문항은 이 페이지만 가진 결합(순수 태스크·차원 스냅샷·처리 시각 파티셔닝·과거 의존)을
# 겨냥한다. alias 문항은 영어 병기가 정확 일치 키로 사는지를 잰다 — 인용 블록의 문면이
# 색인되는지도 함께 본다. cross-domain 하나는 이번 런이 건 검증 축 연결(메타모픽 관계와
# 모양이 같다는 읽기)이 검색에서도 짝으로 잡히는지를 본다.
