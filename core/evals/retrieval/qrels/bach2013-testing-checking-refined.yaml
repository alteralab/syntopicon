# 질문지 조각 — Bach & Bolton 테스팅·체킹 구분 승급(2026-08-22, 자동화 경계 갈래의 첫 반입).
# 이 소스가 만드는 검색 위험은 셋이다. ① 이 갈래가 새로 채택한 음차 "체킹"이 형태소
# 레그에서 살아남는지가 미지수다 — 이 코퍼스의 기존 "체킹"은 전부 모델 체킹(model
# checking)과 팩트체킹이라, 새 낱말이 그 쏠림을 뚫어야 한다. ② "테스팅"은 이 코퍼스에서
# 가장 과부하된 낱말이라 단독으로는 아무것도 가르지 못한다 — exact 문항은 전부 이
# 페이지가 소유한 복합명사로 잡았다. ③ 정의가 판마다 다른 소스라 정의 문면의 원어
# (mechanistic process·algorithmic decision rules)가 검색 키로 사는지를 따로 재야 한다.
# 마지막 문항은 contradicts 쌍 계측이다 — 한 질의가 양 극을 함께 물어 오지 않으면
# 이 KB는 논쟁을 정설로 보여 주게 된다. 쌍의 반대 극 조각은 kaner2013-insapience.yaml.
