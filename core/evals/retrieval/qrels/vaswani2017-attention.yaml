# 질문지 조각 — Vaswani et al. 2017 "Attention Is All You Need"(NIPS 2017) 반입(2026-08-25).
# 이 소스는 원전이고, 같은 개념을 2차 경유로 서술한 페이지 둘(transformer-architecture,
# kv-cache-and-attention-optimization)이 이미 있다. 그래서 이 조각의 관심사는 둘이다.
#   ① 원전에만 있는 것(나눗셈의 이유·표 1의 세 척도·판 대조·원 실험 수치)이 원전
#      페이지로 가는가.
#   ② 원어 병기가 실제로 검색 키로 서는가 — scaled dot-product attention 같은 이름은
#      이 KB가 번역하지 않고 원어로 두기로 한 것이라, 실패하면 병기 정정 대상이지
#      질문 오류가 아니다.
source: vaswani2017-attention
added: 2026-08-25
queries:
  - id: att-exact-1
    query: "왜 내적을 키 차원의 제곱근으로 나누나"
    type: exact
    description: "원전에만 있는 근거 — 소프트맥스 기울기가 작아지는 영역"
    expected_files: ["concepts/why-self-attention.md"]
    expected_in_top_k: 5
  - id: att-exact-2
    query: "위치 인코딩을 사인과 코사인으로 고른 이유"
    type: exact
    description: "원전의 선택 근거 — 외삽 가능성. 학습된 임베딩과 결과가 거의 같았다"
    expected_files: ["concepts/why-self-attention.md"]
    expected_in_top_k: 5
  - id: att-exact-3
    query: "서로 다른 표현 부분공간에 동시에 주의를 준다"
    type: exact
    description: "멀티 헤드의 동기. 이 어휘는 원전 페이지에만 있다"
    expected_files: ["concepts/why-self-attention.md"]
    expected_in_top_k: 5
  - id: att-alias-1
    query: "scaled dot-product attention"
    type: alias
