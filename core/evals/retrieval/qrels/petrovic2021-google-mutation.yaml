# 질문지 조각 — Petrović·Ivanković·Fraser·Just("Practical Mutation Testing at Scale:
# A View from Google", IEEE TSE 수용판) 승급. 2026-08-23, 스위트 평가 갈래의 다섯째 반입.
# 정답 페이지는 `concepts/mutation-testing-not-a-final-arbiter.md` 하나이고 원전 쪽 각도를
# 재는 조각이 `demillo1978-hints.yaml`이다. 두 조각은 같은 페이지를 겨누되 질의가 겹치지
# 않는다 — 저쪽은 1978년의 어휘와 실측, 이쪽은 규모·운용·수치다.
#
# 이 소스가 만드는 검색 위험은 둘이다.
#
# 하나는 **산업 배선 어휘의 간섭**이다. "코드 리뷰"·"관문"·"필터"는 승급 시점에
# filter-chain-for-generated-tests와 current-behaviour-as-oracle가 이미 나눠 갖는다.
# 그쪽은 생성된 테스트를 거르는 관문이고 이쪽은 뮤턴트를 띄우는 제안이라 성격이 다른데,
# 어휘가 닮아 서로를 밀어낼 수 있다. petrovic-x-1이 그 자리를 잰다.
#
# 다른 하나는 반대 방향이다. `arid`·`변경 목록`·`changelist`는 승급 시점에 이 소스 밖에서
# 0건이었다. exact·alias 문항이 실패하면 간섭이 아니라 신규 페이지가 색인에 안 붙은 것이다.
#
# 그리고 이 조각의 성격이 하나 더 있다. 이 페이지의 핵심 주장은 "가장 큰 규모의 사례가
# 점수 게이트를 쓰지 않는다"인데, 같은 회사가 커버리지에는 관문을 권한다
# (coverage-operating-guidelines). 두 문서를 같은 운용으로 읽으면 안 된다는 구분이
# 검색에서도 서는지를 petrovic-x-2가 잰다.
source: petrovic2021-google-mutation
added: 2026-08-23
queries:
  - id: petrovic-exact-1
