# 질문지 조각 — Schelter et al. 2018 "Automating Large-Scale Data Quality Verification"
# (PVLDB 11(12):1781–1794). 승급 2026-08-25, 데이터 검증 갈래의 둘째 반입.
#
# 이 소스가 만드는 검색 위험은 세 겹이다. 첫째, "데이터 품질"과 "제약" 어휘의 과밀 —
# data-quality-enforcement-patterns(AWAP·Constraints Enforcer)·quality-observation-patterns·
# data-quality-management·data-validation-for-ml-pipelines·enforcing-constraints-in-dataflow·
# design-by-contract가 이미 그 낱말을 쓴다. 둘째, "메트릭" 어휘의 과적재 —
# semantic-and-metrics-layers는 지표 정의 계층으로, data-product-observability는 관측의 세
# 기둥으로 쓴다. 이 페이지의 메트릭은 제약이 환원되는 계산 단위라 셋째 뜻이다. 셋째,
# "이상 탐지" 어휘 — observability-detector-patterns와 drift-detection이 소유한다.
#
# 그래서 exact 문항은 이 페이지만 가진 어휘(제약→메트릭 번역·증분 계산의 상태와 델타·
# 제약 제안·예측 가능성·스캔 공유)를 겨냥하고, alias 문항은 원어 병기가 정확 일치 키로
# 사는지를 잰다 — 특히 'unit tests' for data는 이 소스를 부른 조항의 문구라 회수 실패가
# 곧 인용 불가다. cross-domain 하나는 이번 런이 건 양방향 링크(임의 제약 대 제한된 스키마
# 언어)가 검색에서도 짝으로 잡히는지를 본다.
source: schelter2018-data-quality
added: 2026-08-25
queries:
  - id: schelter-exact-1
    query: "선언한 제약을 메트릭 계산으로 번역한다"
    type: exact
    description: "이 페이지의 중심 기제 — 제약 어휘가 과밀한 자리에서 여기가 1위여야 한다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-exact-2
    query: "증가하는 데이터셋의 증분 메트릭 계산 상태와 델타"
    type: exact
    description: "3.2절의 계산 모델 — 상태·델타·재정식화를 함께 다루는 페이지는 여기뿐이다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-exact-3
    query: "제약 제안 프로파일링 휴리스틱"
    type: exact
    description: "스키마 없는 데이터에서 제약을 제안받는 절차 — 이 페이지의 고유 어휘다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-exact-4
    query: "예측 가능성 메트릭 다른 열로 이 열 값을 맞힌다"
    type: exact
    description: "정확성 차원을 대신하는 이 논문의 고유 기여 — 훈련 데이터 품질 페이지와 갈려야 한다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-exact-5
    query: "스캔 공유 여러 메트릭을 집계 질의 하나로"
    type: exact
    description: "실행 층의 최적화 이름 — 선언 개수와 훑기 개수를 가르는 자리다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-alias-1
    query: "unit tests for data"
    type: alias
    description: "이 소스를 부른 조항의 원문 문구 — 회수 실패는 곧 인용 불가다. 단위 테스트 어휘가 과밀한 검증 축에서 갈려야 한다"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-alias-2
    query: "constraint suggestion coverage"
    type: alias
    description: "원어 병기 — 제안된 제약이 남은 데이터에서 얼마나 지켜졌는가를 잰 실험의 키"
    expected_files: ["concepts/declarative-data-quality-constraints.md"]
    expected_in_top_k: 5
  - id: schelter-alias-3
    query: "Automating Large-Scale Data Quality Verification PVLDB"
    type: alias
    description: "원문 제목과 게재 문면 — 소스 메타와 페이지 둘 중 하나는 잡혀야 한다"
    expected_files: ["sources/schelter2018-data-quality.md", "concepts/declarative-data-quality-constraints.md"]
