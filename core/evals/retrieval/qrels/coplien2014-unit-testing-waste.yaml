# 질문지 조각 — Coplien "Why Most Unit Testing is Waste"(rbcs-us.com, Wayback 2023-09-23 확보본)
# 반입(2026-08-24, unit-design-doubles 갈래의 여섯째 런). 신규 페이지 하나와 개정판 하나이고,
# 둘은 `contradicts`로 묶인 논쟁 쌍이다.
#
# 이 소스가 만드는 검색 위험은 세 겹이다.
# 첫째, **"단위 테스트"가 이 코퍼스에서 가장 붐비는 낱말이다.** 같은 갈래의
# resistance-to-refactoring-and-false-positives · what-to-replace-with-mocks ·
# test-double-vocabulary-and-tdd-styles · test-desiderata가 전부 그 낱말을 더 많은 분량으로
# 쓰고, google-test-sizes-and-suite-operations는 이 런의 개정판이기까지 하다. 그래서 exact
# 문항은 낱말이 아니라 **이 페이지만 가진 주장의 형태**(1년 무실패·정보 이론·낭비의 논거)를
# 겨냥한다.
# 둘째, **"낭비"라는 역어가 코퍼스에 60여 곳 있다**(성능·GC·데이터 축이 대부분이다). 원어
# waste도 pragmatic-teams에 있다. 그래서 낱말 하나로는 잡히지 않고, 검증 축의 문맥과 함께
# 물어야 한다.
# 셋째, **논쟁 쌍이라 한쪽만 잡히면 이 KB의 판정이 왜곡된다.** cross-domain 문항 둘이 그
# 배선을 잰다 — 하나는 contradicts 양극이 함께 잡히는지, 다른 하나는 커버리지 목표화라는
# 접점에서 세 문헌이 함께 잡히는지다.
#
# alias 문항은 코퍼스에서 이 페이지만 가진 원어로 잡았다(Green Bar Fever · Janzen). 오식
# Saledian은 확보본 표기라 소스 메타와 페이지 둘 다에 있어 alias로 쓰지 않고 남겨 둔다.
