# 질문지 조각 — 특성화 테스트 승급(2026-08-21, 검증 축 여섯 번째이자 오라클 갈래 마지막).
# 이 페이지가 지는 검색 위험은 **바로 앞 런이 세운 형제와의 간섭**이다. current-behaviour-as-oracle과
# 이 페이지는 같은 대상(현재 동작을 기대값으로 삼는 것)을 다루고 어휘도 겹친다 — 두 페이지가 서로의
# 절을 인용하며 링크로 묶여 있어 이웃 확장이 둘을 한 덩어리로 끌어올 수도 있다. 갈리는 것은 질문이다:
# 그쪽은 **그 절차의 전제를 잰 실증**, 이쪽은 **그 절차의 처방과 경계**다.
# exact 문항은 이 페이지만 가진 어휘(특성화 테스트·도덕적 권위·레거시 코드의 재정의)를 겨냥하고,
# alias 문항은 이 페이지에서만 병기된 원어(characterization test·Cover and Modify·이 책 제목)가
# 갈라 주는 키로 사는지를 잰다. cross-domain 셋은 이 페이지가 실제로 건 링크 셋이 짝으로 걸리는지를 본다.
#
# **sib 문항 둘이 이 조각의 핵심 계측이다** — 처방을 묻는 질의가 이쪽으로, 실증을 묻는 질의가
# 그쪽으로 갈리는지를 잰다. 갈리지 않으면 신설(형제) 판정이 검색에서는 성립하지 않는다는 신호이고,
# 그때 볼 것은 유사도가 아니라 두 페이지가 같은 질문에 답하게 됐는가다.
source: feathers2004
added: 2026-08-21
queries:
  - id: chartest-exact-1
    query: "특성화 테스트"
    type: exact
    description: "페이지 제목 그대로 — 이 KB에서 이 페이지에만 있는 복합명사다"
    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-exact-2
    query: "레거시 코드는 테스트가 없는 코드다"
    type: exact
    description: "저자가 통용 정의를 버리고 다시 세운 정의 — 이 페이지의 절 하나가 통째로 이것이다"
    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-exact-3
    query: "테스트에 도덕적 권위가 없다"
    type: exact
    description: "저자가 이 테스트의 오라클 지위를 스스로 낮추는 자리 — 이 페이지의 축"
    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-exact-4
    query: "보존 오라클과 수용 오라클"
    type: exact
    description: "용도 한정 절 — 조항이 이 소스를 인용할 때 반드시 함께 와야 하는 경계다"
    expected_files: ["concepts/characterization-test.md"]
    expected_in_top_k: 5
  - id: chartest-alias-1
    query: "characterization test"
    type: alias
    description: "원어 병기 — 저자가 붙인 이름이고 확립 역어가 없어 원어가 정확 일치 키다"
    expected_files: ["concepts/characterization-test.md"]
