# redirect 스텁 — 개명·이동·분할·병합의 잔여물(PLAN §2.3). tools/rename이 생성한다.
# lint 동작(체인 붕괴·경유 링크 재작성 제안)은 PLAN §4.3 표가 정본.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "redirect.yaml"
title: redirect

type: object
required: [type, superseded_by]
properties:
  type: {const: redirect}

  superseded_by:
    # 대상 지정. 동일 KB 슬러그가 기본이고, KB 간 이동 잔여물만 정규형
    # `<kb>/<slug>`를 허용한다(PLAN §2.1·§2.5-3의 유일한 정규형 예외).
    anyOf:
      - {$ref: "common.yaml#/$defs/slug"}
      - {$ref: "common.yaml#/$defs/qualified_slug"}

  title: {type: string, minLength: 1}
  description: {type: string, minLength: 1}
  generated: {$ref: "common.yaml#/$defs/stamp"}
