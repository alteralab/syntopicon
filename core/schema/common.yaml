# 공유 정의 — per-type 스키마들이 $ref로 참조한다. 이 파일 자체는 어떤 파일도 검증하지 않는다.
#
# 크로스 파일 $ref는 상대 $id로 해결된다(jsonschema 4.26.0 + referencing 0.37.0 로컬 실측).
# validate가 6개 리소스를 Registry에 올린 뒤 type→스키마로 선택한다.
#
# YAML 규약의 집행 기전: PyYAML이 따옴표 없는 `2026-08-05`를 datetime.date로,
# `...T05:00:00Z`를 datetime으로 역직렬화하므로 `type: string`이 곧 "날짜는 따옴표 문자열"
# 규약(PLAN §2.1)의 집행자다. 별도 검사 불요.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "common.yaml"
title: syntopicon 공유 정의

$defs:

  # ── 식별자 ────────────────────────────────────────────────────────────────
  slug:
    # 개념 슬러그(PLAN §2.5-4): 영문 소문자 kebab, ~80자, 한글 금지.
    # 선두 문자를 letter로 강제 = 날짜/번호 접두 금지(무예외).
    # 후행 `-<숫자>` 부정 전방탐색 = 숫자 접미 금지. `-v2` 같은 의미 한정자는 통과한다
    # (PLAN §2.1 예시 `raft-read-v2`가 통과해야 함).
    type: string
    maxLength: 80
    pattern: "^(?!.*-[0-9]+$)[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  qualified_slug:
    # 정규 참조형 `<kb>/<slug>`(PLAN §2.5-3). 저장소 전역 유일, 경로에서 파생.
    # redirect 스텁의 KB 간 이동 잔여물에만 쓰인다.
    type: string
    pattern: "^[a-z][a-z0-9-]*/(?!.*-[0-9]+$)[a-z][a-z0-9]*(-[a-z0-9]+)*$"

  citekey:
    # PLAN §2.2: 콜론·공백·대문자 금지(각주 앵커 파손 방지). 구조 규칙
    # (저자성last연도[-슬러그])와 유일성은 파이썬 관계 규칙 층이 검사한다.
    # 슬러그와 달리 `-2` 숫자 접미가 허용된다(동일 저자·연도 충돌 해소 — §2.5-4).
    type: string
    minLength: 1
    pattern: "^[a-z0-9_.-]+$"

  qualified_citekey:
    # sources/의 redirect 스텁이 KB 간 이동을 가리킬 때. slug 계열과 문자집합이 달라
    # 따로 둔다 — 하나로 합치면 개념 슬러그 쪽 검증이 느슨해진다.
    type: string
    pattern: "^[a-z][a-z0-9-]*/[a-z0-9_.-]+$"

  repo_path:
    # frontmatter 경로 = 저장소 루트 기준(PLAN §2.4). OS 절대경로 금지는
    # 파이썬 관계 규칙의 경로 실존 검사가 잡는다(저장소 밖 경로는 존재하지 않음).
    type: string
    pattern: "^/[^/].*$"

  # ── 시간(PLAN §2.1 시간 해상도) ────────────────────────────────────────────
  date:
    # 유효성 시점 = YYYY-MM-DD
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

  datetime:
    # 이벤트 시점 = ISO 8601. 초 단위 transaction time은 git이 제공하므로
    # 여기서는 기록 시점의 자기 보고만 담는다.
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"

  # ── 신뢰 계층(PLAN §2.7-7 동결 코어) ───────────────────────────────────────
  actor:
    # generated.by / verified[].by. 관용: 모델 id(`claude-fable-5`),
    # 사람(`human:<이름>`), 도구(`tools/<이름>`). 폐쇄 어휘가 아니다 —
    # PLAN이 어휘를 닫지 않았고, 닫으면 모델 id마다 스키마 개정이 필요해진다.
    type: string
    minLength: 1

  stamp:
    type: object
    properties:
      by: {$ref: "common.yaml#/$defs/actor"}
      at: {$ref: "common.yaml#/$defs/datetime"}
    required: [by, at]
    additionalProperties: false

  verified:
    # 부재 = unverified 계층. 빈 리스트 금지(PLAN §2.1) → minItems: 1.
    type: array
    minItems: 1
    items: {$ref: "common.yaml#/$defs/stamp"}

  status:
    # 부재 = stable. 폐쇄 어휘 = PLAN이 실제로 규정한 두 값뿐:
    #   draft      — inbox/ 초안(§2.3)
    #   deprecated — supersession 대상(§2.1)
    # `stable`을 명시 기록하는 것은 금지한다 — "값이 생길 때만 기록"(§2.1).
    enum: [draft, deprecated]

  source_ref:
    # 개념/종합 페이지의 sources[] 항목. id는 본문 각주 라벨과 정합해야 하며
    # (파이썬 관계 규칙), resource는 실존해야 한다.
    type: object
    properties:
      id: {$ref: "common.yaml#/$defs/citekey"}
      resource: {$ref: "common.yaml#/$defs/repo_path"}
    required: [id, resource]
    additionalProperties: false

  # ── CSL 차용(PLAN §2.2) ────────────────────────────────────────────────────
  name_variable:
    # CSL 공식 csl-data.json definitions/name-variable에서 실제로 쓰는 키만 추린 것.
    # 원본은 additionalProperties: false지만 여기서는 열어 둔다 — 상위 규약이
    # OKF unknown-key 허용(§2.7)이라 하위 객체만 닫으면 규약이 어긋난다.
    type: object
    properties:
      family: {type: string}
      given: {type: string}
      literal: {type: string}      # 기관 저자 등 분해 불가 이름
      suffix: {type: string}
    minProperties: 1

  name_list:
    type: array
    minItems: 1
    items: {$ref: "common.yaml#/$defs/name_variable"}
