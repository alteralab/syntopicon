# 질문지 조각 — Beck "Test Desiderata"(testdesiderata.com, 2026-08-20 확보본)
# 반입(2026-08-24, unit-design-doubles 갈래의 넷째 런). 한 쪽짜리 소스이고 페이지도 하나다.
#
# 이 소스가 만드는 검색 위험은 두 겹이다.
# 첫째, **성질 이름이 흔한 낱말이다** — 빠름·격리·결정적·자동은 코퍼스 곳곳에 있고
# `flaky-test-root-causes-and-fixes`·`why-fewer-end-to-end-tests`·
# `google-test-sizes-and-suite-operations`가 같은 낱말을 더 많은 분량으로 쓴다. 그래서
# exact 문항은 **이 페이지만 가진 형식**(성질이 열둘이라는 수, 세 관계 문장, 원문 정의의
# 한국어 재서술)을 겨냥한다.
# 둘째, **원어 열둘 가운데 코퍼스에서 이 페이지만 가진 것이 셋뿐이다**(Composable ·
# Writable · Inspiring). 나머지는 다른 페이지와 겹치거나(Predictive는
# predictive-analytics-and-algorithmic-harm) 이 런의 개정판과 겹친다(structure-insensitive는
# resistance-to-refactoring-and-false-positives에도 들어갔다). alias 문항은 앞의 셋으로
# 잡고, 겹치는 원어는 cross-domain으로 옮겨 **두 페이지가 함께 잡히는지**를 잰다.
#
# cross-domain 둘은 이 런이 실제로 건 접점이다. 하나는 양방향 링크(구조 둔감 ↔ 리팩터링
# 내성)이고, 다른 하나는 **낱말이 같은데 가리키는 것이 다른 자리**(테스트끼리의 격리 ↔
# 실패 위치 지목)다. 뒤엣것은 두 페이지가 섞이는지를 보는 문항이라 실패해도 병합 신호가
# 아니다 — 이 KB가 두 뜻을 갈라 적어 둔 것이 맞는지의 확인이다.
source: beck2019-test-desiderata
