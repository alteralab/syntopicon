# 질문지 조각 — Kaner 반박 승급(2026-08-22, 자동화 경계 갈래의 모순 쌍 반대 극).
# 쌍의 다른 극 조각은 bach2013-testing-checking-refined.yaml 이고, 두 조각의 정답
# 페이지가 다르다. 이 페이지가 만드는 검색 위험은 셋이다. ① 제목이 부정문이라
# ("거짓 이분법") 주제어가 아니라 판정어다 — 무엇에 대한 반박인지가 제목에 없어서
# 주제 질의가 상대 극으로만 흘러갈 수 있다. ② 이 글의 고유 어휘가 대부분 원어
# (HiVAT·sapient·false dichotomy)라 한국어 표면형으로 회수되는지를 따로 재야 한다.
# ③ "자동화"는 이 코퍼스에서 CI·배포·도구 쪽으로 무겁게 쏠려 있어 테스팅 논쟁이
# 그 무게를 뚫는지가 관건이다.
# 마지막 문항은 contradicts 쌍 계측이다 — 상대 조각의 tcd-pair-1과 다른 표면형으로
# 같은 것을 잰다(이쪽은 자동화 쪽 낱말로, 저쪽은 구분 쪽 낱말로 들어간다).
