[project]
name = "syntopicon"
version = "0.1.0"
requires-python = ">=3.14"
# Tier A(md를 변경하는 도구 — validate/lint/rename/kb-new)의 의존은 최소·핀이다(PLAN §3).
# `==`로 고정하는 이유: uv.lock이 실질 핀이지만, 10–20년 축에서 사람이 읽는 파일에
# 의도가 남아 있어야 한다. 갱신은 연간 툴체인 핀 점검 항목(PLAN §6 운영 캘린더).
dependencies = [
    "jsonschema==4.26.0",   # per-type JSON Schema 검증 (Draft 2020-12)
    "referencing==0.37.0",  # 크로스 파일 $ref 레지스트리 — jsonschema가 위임하는 계층
    "markdown-it-py==4.2.0",# md AST — 링크 재작성·각주 정합·표 파싱. regex 파싱 금지(PLAN §3)
    "pyyaml==6.0.3",        # frontmatter·schema/*.yaml
]
