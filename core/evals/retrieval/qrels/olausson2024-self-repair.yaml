# 질문지 조각 — Olausson et al. 2024 승급(2026-08-21, 검증자 독립성 갈래의 네 번째 반입).
# 이 소스가 만드는 검색 위험은 갈래 밖 간섭이다 — "자기 평가"와 "반성"은 이미
# agent-reflection-and-error-correction과 ai-judge-selection이 소유하고, pass@k는
# functional-correctness가, 자기선호는 self-recognition-and-self-preference가 소유한다.
# 그래서 자기·피드백·평가 어휘로 던진 질의가 이 페이지를 지나칠 수 있다. exact 문항은
# 이 페이지만 가진 어휘(자기 수정·은탄환·수리 트리·수리 성공률·초기 프로그램의 다양성)를
# 겨냥하고, alias 문항은 이 페이지에서만 병기된 원어(self-repair·repair tree·baseline)가
# 갈라 주는 키로 사는지를 잰다. semantic 문항은 자기·수정이라는 낱말을 쓰지 않은 질의가
# 닿는지를 본다. cross-domain 넷은 이번 런이 실제로 건 링크(자기선호 기제·오류 상관·
# 판정자 고르기·pass@k 원정의)가 검색에서도 이웃으로 잡히는지를 본다.
source: olausson2024-self-repair
added: 2026-08-21
queries:
  - id: srfb-exact-1
    query: "자기 수정의 피드백 병목"
    type: exact
    description: "페이지 제목 그대로 — 반성 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/self-repair-feedback-bottleneck.md"]
    expected_in_top_k: 5
  - id: srfb-exact-2
    query: "자기 수정은 은탄환이 아니다"
    type: exact
    description: "원문 제목이 던지는 물음의 답 — 이 KB에서 이 페이지에만 있는 문장"
