    expected_files: ["concepts/llm-empirical-study-reporting-norms.md"]
    expected_in_top_k: 5
  - id: lenorm-exact-4
    query: "종단 재실행"
    type: exact
    description: "다시 재라는 요구가 어느 층에 있는지를 답하는 낱말. 이 KB에 이 페이지만 갖는다"
    expected_files: ["concepts/llm-empirical-study-reporting-norms.md"]
    expected_in_top_k: 5
  - id: lenorm-exact-5
    query: "연구 유형 일곱"
    type: exact
    description: "지침의 적용 단위인 분류 — 벤치마크 계열 페이지들과 갈라 주는 어휘"
    expected_files: ["concepts/llm-empirical-study-reporting-norms.md"]
