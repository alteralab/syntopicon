# 질문지 조각 — Anthropic 2026 "Best practices for Claude Code" 승급(2026-08-22,
# 검증자 독립성 갈래의 다섯 번째 반입이자 이 갈래 첫 벤더 문서).
# 이 소스가 만드는 검색 위험은 두 겹이다. 첫째, 갈래 안 간섭 — 검증자·판정자·분리
# 어휘는 이미 self-repair-feedback-bottleneck·correlated-errors-across-llms·
# self-recognition-and-self-preference·ai-judge-selection이 소유하고, 그 넷은 전부
# 실증 페이지다. 둘째, 갈래 밖 간섭 — "에이전트"와 "리뷰"는 agent-* 계열과
# code-review 성격 페이지들이 가진다. 그래서 exact 문항은 이 페이지만 가진 문면
# 어휘(문면·벤더 실무 문서·일한 에이전트가 채점·과잉 보고)를 겨냥하고, alias 문항은
# 이 페이지에서만 병기된 원어(vendor guidance·fresh context·verification subagent·
# adversarial review step)가 갈라 주는 키로 사는지를 잰다. semantic 문항은 실무자가
# 실제로 던질 법한 물음이 실증 페이지가 아니라 이 페이지로 닿는지를 본다.
# cross-domain 셋은 이번 런이 실제로 건 양방향 링크(더 강한 판정자·저자 은닉·
# 오류 상관)가 검색에서도 이웃으로 잡히는지를 본다.
source: anthropic2026-claude-code-best-practices
added: 2026-08-22
queries:
  - id: vsaw-exact-1
    query: "에이전트 작업 흐름의 검증자 분리"
    type: exact
    description: "페이지 제목 그대로 — 실증 네 페이지가 아니라 이 페이지가 1위여야 한다"
    expected_files: ["concepts/verifier-separation-in-agent-workflows.md"]
    expected_in_top_k: 5
  - id: vsaw-exact-2
    query: "일한 에이전트가 채점하지 않는다"
    type: exact
    description: "문서가 요구하는 분리를 이 KB가 옮긴 문장 — 이 페이지에만 있다"
    expected_files: ["concepts/verifier-separation-in-agent-workflows.md"]
    expected_in_top_k: 5
  - id: vsaw-exact-3
    query: "근거가 아니라 문면"
    type: exact
    description: "이 페이지의 지위 절을 여는 말 — 벤더 문서를 실증과 가르는 어휘다"
    expected_files: ["concepts/verifier-separation-in-agent-workflows.md"]
    expected_in_top_k: 5
  - id: vsaw-exact-4
