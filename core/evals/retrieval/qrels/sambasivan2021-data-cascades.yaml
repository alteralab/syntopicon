# 질문지 조각 — Sambasivan et al. 2021 "'Everyone wants to do the model work, not the
# data work': Data Cascades in High-Stakes AI"(CHI '21). 데이터 검증 갈래의 넷째이자
# 대장 마지막 반입.
#
# 이 소스가 만드는 검색 위험은 두 겹이다. 첫째, **"데이터 품질" 어휘의 과밀** —
# data-quality-management(웨어하우스)·data-quality-enforcement-patterns(파이프라인 패턴)·
# training-data-quality(훈련 데이터 여섯 특성)·declarative-data-quality-constraints(제약
# 선언)·quality-observation-patterns가 이미 그 낱말을 쓴다. 이 페이지는 품질을 어떻게
# 재거나 강제하는가가 아니라 **재지 않았을 때 벌어진 일**을 담으므로, 같은 낱말로 물으면
# 밀리고 자기 질문으로 물으면 1위여야 한다. 둘째, **상류/하류 어휘의 과적재** —
# data-lake·data-quantum·dead-letter-and-dropped-records가 다른 뜻으로 쓴다.
#
# exact 문항은 이 페이지만 가진 결합(캐스케이드의 정의·유형 넷·goodness-of-data·53명
# 표본)을 겨냥한다. alias 문항은 영어 병기가 정확 일치 키로 사는지를 잰다 — 정의는 인용
# 블록 안에 있으므로 인용 블록의 색인 여부도 함께 본다. cross-domain 둘은 이번 런이 건
# 배선(오라클 부재의 데이터판 · 선언적 제약 페이지가 남긴 물음의 해소)이 검색에서도
# 짝으로 잡히는지를 본다.
