# 질문지 조각 — Zhong 외 2025(ImpossibleBench) 승급(2026-08-22, 수용·벤치마크 갈래의
# 셋째 반입).
# 이 소스가 만드는 검색 위험은 앞 둘과 모양이 다르다. 반입 전 코퍼스를 훑어 보니
# 이 논문의 고유 어휘(SWE-bench·LiveCodeBench·치팅·스캐폴드)는 이 KB에 하나도 없었다.
# 그래서 간섭은 고유 어휘가 아니라 **일반 낱말** 쪽에서 온다. 위험은 셋이다.
# 첫째, "오버로딩"은 이미 파이썬·JVM 계열 열넷이 소유하고 그중 하나는 제목이
# operator-overloading-in-python이다 — 그래서 이 원어를 별칭 문항으로 쓰지 않고,
# 대신 "연산자를 바꿔 테스트를 통과시킨다"는 **행위 서술**이 파이썬 쪽이 아니라
# 이쪽으로 오는지를 semantic 문항으로 잰다. 둘째, "monitor"는 마흔 곳 넘게 쓰이므로
# 감시자 문항은 반드시 이 페이지의 결과와 묶어서 던진다. 셋째, "벤치마크"와 "테스트"는
# 갈래 안 형제(benchmark-test-inadequacy)와 오라클 계열이 나눠 가지므로, 이 페이지는
# 자기만 가진 어휘(불가능 과제·치팅률·착취)로 걸려야 한다.
# cross-domain 셋은 이번 런이 실제로 건 링크를 겨냥한다 — 특히 x-1은 개정판이 가설을
# 실측으로 바꾼 자리라, 두 페이지가 짝으로 잡히지 않으면 개정이 검색에 반영되지 않은 것이다.
