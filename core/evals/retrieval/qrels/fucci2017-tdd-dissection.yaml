# 질문지 조각 — TDD 효과의 실증 세 편(Fucci TSE 2017 · Tosun ICSSP'18 · Fucci ESEM'16)
# 반입(2026-08-24, unit-design-doubles 갈래의 일곱째·마지막 런). 신규 페이지 하나와 개정판
# 셋이고, 신규 페이지는 `contradicts`로 묶인 두 극의 중재항이다(엣지는 걸지 않는다).
#
# 이 소스 묶음이 만드는 검색 위험은 네 겹이다.
# 첫째, **TDD라는 낱말이 이 코퍼스에서 이미 붐빈다.** test-double-vocabulary-and-tdd-styles ·
# tdd-high-gear-and-low-gear · test-to-code · self-testing-code가 전부 그 낱말을 쓰고, 그
# 가운데 둘은 제목에 TDD를 달고 있다. 그래서 exact 문항은 낱말이 아니라 **이 페이지만 가진
# 측정의 형태**(네 차원·순서 차원·부정 조건절)를 겨냥한다.
# 둘째, **"순서"는 이 코퍼스에서 거의 전부 다른 뜻이다**(정렬·실행 순서·선호 순서). 그래서
# 원어 sequencing을 alias로 따로 잡는다.
# 셋째, **뮤테이션 점수가 다른 갈래의 소유물이다.** mutation-validity-evidence ·
# assertions-predict-mutation-kills · coverage-predicts-mutation-kills가 그 낱말을 훨씬 많은
# 분량으로 쓴다. 그래서 이 런의 뮤테이션 문항은 **TDD와 test-last를 견준다는 조건**을 함께
# 건다.
# 넷째, **중재항이라 양극과 함께 잡혀야 판정이 읽힌다.** cross-domain 문항 둘이 그 배선을
# 잰다 — 하나는 두 극과 이 페이지가 함께 잡히는지, 다른 하나는 뮤테이션 점수의 조건 페이지와
# 함께 잡히는지다.
#
# alias 문항은 코퍼스에서 이 페이지만 가진 원어·고유명으로 잡았다(sequencing · ICSSP ·
# blind analysis).
