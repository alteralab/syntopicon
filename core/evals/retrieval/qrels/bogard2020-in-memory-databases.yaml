# 질문지 조각 — Bogard, "Avoid In-Memory Databases for Tests"(jimmybogard.com, 2026-08-20 확보본)
# 반입(2026-08-24, unit-design-doubles 갈래의 다섯째 런). 세 소스가 한 페이지를 세운다:
# concepts/what-in-memory-database-doubles-lose.md
#
# 이 조각이 겨냥하는 것은 둘이다.
# 첫째, **이 소스만 가진 논거**를 잡는다 — 트랜잭션이 아무 일도 하지 않는다는 것과, 대역이
# 원시 SQL을 막아 개발자가 SQL을 피하게 된다는 것이다. 뒤엣것은 이 코퍼스에서 이 페이지에만
# 있다.
# 둘째, **낱말이 겹치는 자리를 피한다.** `인메모리`는 저장 엔진 갈래(lsm-tree ·
# query-execution-compilation-and-vectorization · compute-storage-separation)가 훨씬 많은
# 분량으로 쓰는 낱말이라 exact 문항의 키로 쓰지 않는다. `거짓 양성`도
# resistance-to-refactoring-and-false-positives가 소유하므로 cross-domain으로만 쓴다.
source: bogard2020-in-memory-databases
added: 2026-08-24
queries:
  - id: inmem-bogard-exact-1
    query: "인메모리 공급자에서는 트랜잭션이 아무 일도 하지 않는다"
    type: exact
    description: "이 소스의 가장 강한 논거이자 코퍼스에서 이 페이지만 가진 문장 — 트랜잭션 갈래는 실물 엔진의 의미론을 다루지 대역을 다루지 않는다"
    expected_files: ["concepts/what-in-memory-database-doubles-lose.md"]
    expected_in_top_k: 5
  - id: inmem-bogard-exact-2
    query: "대역이 원시 SQL을 막아 개발자가 SQL을 피하게 된다"
    type: exact
    description: "대역의 한계가 프로덕션 코드의 선택을 바꾼다는 논거 — 이 코퍼스에서 이 페이지에만 있다"
    expected_files: ["concepts/what-in-memory-database-doubles-lose.md"]
    expected_in_top_k: 5
  - id: inmem-bogard-sem-1
    query: "같은 테스트를 두 벌 쓰게 되면 둘째 벌의 값어치는 무엇인가"
    type: semantic
    description: "패러프레이즈 — 인메모리·대역·공급자 낱말 불사용. 이 소스가 접은 첫째 이유"
    expected_files: ["concepts/what-in-memory-database-doubles-lose.md"]
    expected_in_top_k: 5
  - id: inmem-bogard-x-1
    query: "대역을 써서 생기는 거짓 양성은 구현 세부에 결합해서 생기는 거짓 양성과 같은 것인가"
    type: cross-domain
    description: "이 런이 건 접점 — 같은 이름의 실패가 원인이 둘이라는 것. 두 페이지가 함께 잡혀야 그 갈림이 읽힌다"
    expected_files:
      - "concepts/what-in-memory-database-doubles-lose.md"
      - "concepts/resistance-to-refactoring-and-false-positives.md"
    expected_in_top_k: 5
