# 질문지 조각 — Khorikov, Unit Testing: Principles, Practices, and Patterns(확보본 MEAP V03)
# 반입(2026-08-23, unit-design-doubles 갈래의 둘째 런). 신규 페이지 둘:
#   concepts/resistance-to-refactoring-and-false-positives.md
#   concepts/what-to-replace-with-mocks.md
#
# 이 소스가 만드는 검색 위험은 네 겹이다.
# 첫째, **대역 어휘의 과밀이 앞 런보다 더 심해졌다** — fakes-versus-mocks ·
# test-double-preference-at-scale · test-double-vocabulary-and-tdd-styles가 이미 "목·스텁·
# 가짜·대역"을 그대로 쓰고, 이 런이 같은 낱말로 두 페이지를 더 넣는다. 그래서 exact 문항은
# **이 소스만 가진 어휘**(리팩터링 내성, 거짓 양성의 원인, managed/unmanaged 의존, 내부
# 통신 대 시스템 간 통신)를 겨냥한다.
# 둘째, **두 신규 페이지가 서로를 잡아먹을 위험**이 크다 — 같은 책의 이웃 장이고 어휘가
# 겹친다. exact 문항을 페이지별로 갈라 두어 어느 쪽이 어느 질문을 가져가는지 본다.
# 셋째, **원어가 이 두 페이지에만 있는 키가 여럿이다**(resistance to refactoring ·
# managed dependency · unmanaged dependency · observable behavior · overspecification).
# 이 KB는 managed/unmanaged를 역어로 옮기지 않기로 했으므로 alias 문항이 그 결정의
# 검색 대가를 직접 잰다. 실패하면 병기·표기 정정 대상이지 질문 오류가 아니다.
# 넷째, **"리팩터링"이라는 낱말이 이 코퍼스에 리팩터링 카탈로그 계열로 이미 많다**
# (refactoring · when-to-refactor · basic-refactorings · obstacles-to-refactoring).
# topical 문항 하나가 그 간섭을 잰다.
#
# cross-domain 셋은 이 런이 실제로 건 양방향 링크를 겨냥한다.
